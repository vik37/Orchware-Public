
services:

  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: AdminDemo123#
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 5s
      retries: 10
      start_period: 10s
    networks:
      - orchware-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: AdminDemo123#
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - orchware-network

  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Admin123#
      - SEQ_RETENTIONPOLICIES__DEFAULTRETENTIONDAYS=7
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - orchware-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observ-conf/tempo.yml:/etc/tempo.yml
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - orchware-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observ-conf/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    networks:
      - orchware-network

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observ-conf/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped
    networks:
      - orchware-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Grafana123#
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped
    networks:
      - orchware-network

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - orchware-network
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  rabbit:
    image: rabbitmq:3.13-management-alpine
    container_name: "rabbit"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - orchware-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment: 
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Test123#"
    volumes:
      - mssqldata:/var/opt/mssql
      - ./init.sql:/init.sql
    ports:
      - "1433:1433"
    restart: unless-stopped
    networks:
      - orchware-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test123# -C -t 3 -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mssqldata:
  seq-data:
  grafana-storage:
  keycloak_db_data:
  rabbitmq_data:
  
networks:
  orchware-network:
    name: orchware-network
    driver: bridge