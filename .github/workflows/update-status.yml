name: Update Issue Status Badges

on:
  schedule:
    - cron: '0 8 * * 1'  # Секој понеделник во 08:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Користи PAT наместо default bot
        run: python .github/scripts/update_status.py

      - name: Commit and push changes
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/vik37/Orchware-Public.git
          git add README.md
          git commit -m "Update issue status badges" || echo "No changes to commit"
          git push
